name: Build iOS Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          DEVELOPER_DIR=$(xcode-select -p)
          echo "Default Xcode path: $DEVELOPER_DIR"
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi

      - name: Install ldid
        run: brew install ldid

      - name: Fix ChOma include symlink
        run: |
          rm -rf darksword-kexploit-fun/XPF/external/ChOma/include/choma
          ln -sf ../src darksword-kexploit-fun/XPF/external/ChOma/include/choma

      - name: Build XPF Library
        run: |
          make -C darksword-kexploit-fun/XPF output/ios/libxpf.dylib

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          xcodebuild -project darksword-kexploit-fun.xcodeproj \
                     -scheme darksword-kexploit-fun \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     clean build

      - name: Package App into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r darksword-kexploit-fun.ipa Payload

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: darksword-kexploit-fun-ipa
          path: build/darksword-kexploit-fun.ipa
