name: Build DarkSword & Push IPA to Repo

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA (Xcode)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          set -e
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator" || true

      - name: Show project targets
        run: xcodebuild -list -project DarkSword.xcodeproj

      - name: Build (Release, unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project DarkSword.xcodeproj \
            -scheme DarkSword \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee build.log | grep -E "(=== BUILD|error:|warning: [^ ]+\.swift|BUILD (SUCCEEDED|FAILED))" || true
          test -d "build/Build/Products/Release-iphoneos/DarkSword.app"

      - name: Package unsigned IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/DarkSword.app" "Payload/DarkSword.app"
          zip -qry "DarkSword-${GITHUB_REF_NAME}-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa
          echo "IPA_PATH=${PWD}/DarkSword-${GITHUB_REF_NAME}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Push IPA to repository
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tạo thư mục releases nếu chưa có
          mkdir -p releases
          
          # Copy IPA vào thư mục releases
          cp *.ipa releases/
          
          # Copy build log
          cp build.log releases/ 2>/dev/null || true
          
          # Kiểm tra branch hiện tại
          CURRENT_BRANCH=$(git branch --show-current)
          echo "Current branch: $CURRENT_BRANCH"
          
          # Add files
          git add releases/
          
          # Kiểm tra có thay đổi không
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # Commit và push
            git commit -m "Build: Add IPA from ${GITHUB_REF_NAME} [skip ci]"
            git push origin $CURRENT_BRANCH
            echo "✅ Pushed IPA to $CURRENT_BRANCH"
          fi

      - name: Build summary
        if: always()
        run: |
          if [ -f build.log ]; then
            tail -n 25 build.log
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-unsigned-ipa
          path: |
            *.ipa
            build.log
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
