name: Build object files

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Download private source files
      run: |
        curl -L "${{ secrets.DUYKEYAUTH_MM_URL }}" -o DuyKeyAuth.mm
        curl -L "${{ secrets.OBF_MM_URL }}" -o obf.mm
        curl -L "${{ secrets.OBF_H_URL }}" -o obf.h

    - name: Compile to object files
      run: |
        clang++ -c DuyKeyAuth.mm \
          -o DuyKeyAuth.o \
          -arch arm64 \
          -arch x86_64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -mios-version-min=12.0 \
          -fobjc-arc \
          -O2
        
        clang++ -c obf.mm \
          -o obf.o \
          -arch arm64 \
          -arch x86_64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -mios-version-min=12.0 \
          -fobjc-arc \
          -O2

    - name: Upload object files
      uses: actions/upload-artifact@v4
      with:
        name: object-files
        path: |
          DuyKeyAuth.o
          obf.o
