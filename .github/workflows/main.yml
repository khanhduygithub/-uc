name: Build libDuyKeyAuth.a

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Compile object files
      run: |
        # Compile DuyKeyAuth.mm to object file
        clang++ -c DuyKeyAuth.mm \
          -o DuyKeyAuth.o \
          -arch arm64 \
          -arch x86_64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -mios-version-min=12.0 \
          -fobjc-arc \
          -O2
        
        # Compile obf.mm to object file
        clang++ -c obf.mm \
          -o obf.o \
          -arch arm64 \
          -arch x86_64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -mios-version-min=12.0 \
          -fobjc-arc \
          -O2

    - name: Create static library
      run: |
        # Create fat static library
        libtool -static -o libDuyKeyAuth.a DuyKeyAuth.o obf.o
        
        # Verify the library
        lipo -info libDuyKeyAuth.a
        nm libDuyKeyAuth.a | grep -E "T|U" | head -20

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libDuyKeyAuth
        path: libDuyKeyAuth.a
